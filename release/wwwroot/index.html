<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BenchRig - Hardware &amp; Network Diagnostic Platform</title>
    <meta name="description" content="Comprehensive client-side hardware, network, and peripheral diagnostic platform." />
    <meta name="theme-color" content="#0a0a0c" />
    <base href="/" />

    <link href="_framework/dotnet.x28sce8pn3.js" rel="preload" as="script" fetchpriority="high" crossorigin="anonymous" integrity="sha256-6Vu8q/tNJXh0QmdhuQ8IJnxnBlu+iJjym4vOAkomqlA=" />

    <!-- Fonts: Clash Display (display) · Hanken Grotesk (body) · JetBrains Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

    <!-- App styles -->
    <link rel="stylesheet" href="css/app.css" />
    <link href="BenchRig.App.styles.css" rel="stylesheet" />

    <!-- PWA -->
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />

    <!-- LeafletJS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <!-- Firebase SDK (ESM) -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js",
            "firebase/ai": "https://www.gstatic.com/firebasejs/11.10.0/firebase-ai.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot-glow"></div>
            <div class="boot-ring">
                <svg class="loading-progress" viewBox="0 0 100 100">
                    <circle r="44" cx="50" cy="50" />
                    <circle r="44" cx="50" cy="50" />
                </svg>
                <span class="boot-mark">◆</span>
            </div>
            <div class="boot-brand">Bench<span>Rig</span></div>
            <div class="loading-progress-text"></div>
            <div class="boot-tag">Initializing diagnostics…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- LeafletJS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Stripe.js -->
    <script src="https://js.stripe.com/v3/"></script>

    <!-- Tiny global helpers -->
    <script>
        window.BenchRigDownload = (filename, mime, content) => {
            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(url);
        };
    </script>

    <!-- Blazor WASM bootstrap -->
    <script src="_framework/blazor.webassembly.958z1vx7fr.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
